plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}

group = 'com.pyshiki'
version = '1.0.0'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.pyshiki.Main'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 11
}
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

// ===== JAR задачи =====

// Обычный JAR
jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

// Fat JAR (со всеми зависимостями)
tasks.register('fatJar', Jar) {
    manifest {
        attributes(
            'Main-Class': 'com.pyshiki.Main',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
    archiveBaseName.set('shkimori-api')
    archiveVersion.set(project.version)
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Sources JAR
tasks.register('sourcesJar', Jar) {
    archiveBaseName.set('shkimori-api')
    archiveVersion.set(project.version)
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

// Javadoc JAR
tasks.register('javadocJar', Jar) {
    archiveBaseName.set('shkimori-api')
    archiveVersion.set(project.version)
    archiveClassifier.set('javadoc')
    from javadoc
}

// ===== Артефакты для публикации =====
artifacts {
    archives fatJar
    archives sourcesJar
    archives javadocJar
}

// ===== Публикация в Maven Local =====
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact fatJar
            artifact sourcesJar
            artifact javadocJar
            
            pom {
                name = 'Shikimori API Client'
                description = 'Full-featured Java client for Shikimori API'
                url = 'https://github.com/serzhbsv/shikimori_api_java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'serzhbsv'
                        name = 'Serzhbsv'
                    }
                }
            }
        }
    }
}